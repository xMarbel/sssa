name: Buduj VILO dla Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instaluj zaleznosci backendu
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Buduj backend Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name vilo-server --distpath backend-dist --collect-all uvicorn --collect-all fastapi --collect-all multipart --add-data "backend/static;static" --paths backend backend/backend_entry.py
      - name: Instaluj zaleznosci aplikacji
        run: npm install --no-audit --no-fund
      - name: Buduj instalator VILO-Setup.exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: VILO-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
