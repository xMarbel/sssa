
name: Build VILO Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Zbuduj VILO
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VILO backend_entry.py

      - name: Udostepnij EXE
        uses: actions/upload-artifact@v4
        with:
          name: VILO-Windows
          path: dist/VILO.exe
